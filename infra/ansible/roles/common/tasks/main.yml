- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configure UFW - allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Configure UFW - default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Configure UFW - default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure fail2ban - sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      bantime = 1h
    mode: '0644'
  notify: restart fail2ban

- name: Allow all traffic from internal network
  community.general.ufw:
    rule: allow
    from_ip: '10.131.0.0/24'